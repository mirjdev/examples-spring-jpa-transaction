# Connection properties are supplied by PostgresTestcontainerInitializer.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=public
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.generate-ddl=false
# The existing isolation/inheritance examples use Hibernate-generated test fixtures.
# Client integration tests instead use only the real Liquibase migrations.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.liquibase.contexts=test
spring.test.database.replace=none
spring.cloud.config.fail-fast=false
spring.cloud.consul.enabled=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
